<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo ao Revalida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plano de estudos para o Revalida: temas por nível, revisão espaçada, flashcards, caderno de erros, simulados e datas das provas.">
<meta name="theme-color" content="#17695a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revalida">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><h1>Rumo ao <span>Revalida</span></h1></div>
    <button class="timer-mini num" id="timer-mini" data-acao="ir-timer-mini" hidden></button>
    <span class="streak-chip" id="streak"></span>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button class="tab" role="tab" data-aba="painel">Painel</button>
      <button class="tab" role="tab" data-aba="plano">Plano</button>
      <button class="tab" role="tab" data-aba="temas">Temas</button>
      <button class="tab" role="tab" data-aba="revisoes">Revisões <span class="badge" id="badge-rev" hidden></span></button>
      <button class="tab" role="tab" data-aba="questoes">Questões</button>
      <button class="tab" role="tab" data-aba="flashcards">Flashcards</button>
      <button class="tab" role="tab" data-aba="provas">Provas</button>
      <button class="tab" role="tab" data-aba="ajustes">Ajustes</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="painel" role="tabpanel"></section>
  <section id="plano" role="tabpanel" hidden></section>
  <section id="temas" role="tabpanel" hidden></section>
  <section id="revisoes" role="tabpanel" hidden></section>
  <section id="questoes" role="tabpanel" hidden></section>
  <section id="flashcards" role="tabpanel" hidden></section>
  <section id="provas" role="tabpanel" hidden></section>
  <section id="ajustes" role="tabpanel" hidden></section>
</main>
<div class="drawer-bg" id="gaveta-bg" hidden></div>
<aside class="drawer" id="gaveta" role="dialog" aria-modal="true" aria-label="Detalhes do tema" hidden></aside>
<div class="toast" id="toast" role="status" hidden></div>
<datalist id="lista-edicoes">
  <option value="2020"></option><option value="2022/1"></option><option value="2022/2"></option>
  <option value="2023/1"></option><option value="2023/2"></option><option value="2024/1"></option>
  <option value="2024/2"></option><option value="2025/1"></option><option value="2025/2"></option>
  <option value="2026/1"></option><option value="2026/2"></option>
</datalist>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="cards.js"></script>
<script src="core.js"></script>
<script src="temas.js"></script>
<script src="questoes.js"></script>
<script src="flashcards.js"></script>
<script src="plano.js"></script>
<script src="painel.js"></script>
<script src="ajustes.js"></script>
<script src="sync.js"></script>
<script src="pwa.js"></script>
<script src="main.js"></script>
</body>
</html>
